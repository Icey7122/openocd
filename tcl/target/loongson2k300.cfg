# Loongson 2K300 - LoongArch64, single core, 4-bit EJTAG IR.
#
# IR codes match the official config.ls2k300 (fix_ejtag_la):
#   IR_LEN=4, IMPCODE=1, IDCODE=2, ADDRESS=3, DATA=4, CONTROL=5,
#   PCSAMPLE=6, ALL=7, FASTDATA=8, BYPASS=0.
#
# Adapter/interface is intentionally not configured here (interface-agnostic).

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME loongson2k300
}

if { [info exists ENDIAN] } {
	set _ENDIAN $ENDIAN
} else {
	set _ENDIAN little
}

if { [info exists CPUTAPID] } {
	set _CPUTAPID $CPUTAPID
} else {
	# Measured on real hardware: the reset-selected register returns
	# 0x5a5a5a5a (the official check_ejtag marker).  -ignore-bypass is
	# required because its LSB is 0 (OpenOCD would otherwise treat the
	# TAP as bypassed and mis-probe a phantom tap).
	set _CPUTAPID 0x5a5a5a5a
}

jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID -ignore-bypass

target create $_CHIPNAME.cpu loongarch -chain-position $_CHIPNAME.cpu \
	-endian $_ENDIAN

# Single core (official config.ls2k300: core.cpucount 1)
$_CHIPNAME.cpu configure -event reset-start { }
$_CHIPNAME.cpu configure -event reset-end { }

# Diagnostic register access:
#   loongarch idcode
#   loongarch all       ;# raw scan; do not use during an unserviced halt
#   loongarch fastdata  ;# raw 65-bit SPrAcc + DATA scan
#   loongarch use_all   ;# query the default official-style PrAcc path
#   loongarch use_fastdata ;# defaults off, matching put.fastdata 0
